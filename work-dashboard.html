<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/favicons/dc-favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicons/dc-favicon.svg">
  <link rel="apple-touch-icon" href="/favicons/dc-apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #1e293b;
      min-height: 100vh;
      padding: 28px 24px;
    }

    .dashboard {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
    }
    .dash-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #64748b;
    }
    .dash-date {
      font-size: .9rem;
      color: #64748b;
    }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.04);
      padding: 22px 24px;
    }
    .card-label {
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    /* ── Top grid ── */
    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ── Weather ── */
    .weather-temp {
      font-size: 3rem;
      font-weight: 200;
      line-height: 1;
      letter-spacing: -.02em;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .weather-emoji {
      font-size: 1.6rem;
      vertical-align: middle;
      margin-right: 4px;
    }
    .weather-condition {
      font-size: .95rem;
      color: #475569;
      margin-bottom: 14px;
    }
    .weather-detail {
      font-size: .82rem;
      color: #64748b;
      line-height: 2;
    }
    .weather-loading, .weather-error,
    .headlines-loading, .headlines-error {
      font-size: .83rem;
      color: #94a3b8;
      padding: 8px 0;
    }

    /* ── Calendar ── */
    .cal-month {
      font-size: .88rem;
      font-weight: 600;
      color: #0f172a;
      text-align: center;
      margin-bottom: 14px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-day-name {
      font-size: .6rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      text-align: center;
      padding-bottom: 6px;
    }
    .cal-day {
      font-size: .78rem;
      text-align: center;
      padding: 5px 0;
      border-radius: 6px;
      color: #475569;
      cursor: default;
    }
    .cal-day.today {
      background: #2563eb;
      color: #fff;
      font-weight: 600;
    }
    .cal-day.empty { visibility: hidden; }

    /* ── Headlines ── */
    .headlines-list {
      list-style: none;
    }
    .headlines-list li {
      padding: 9px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .headlines-list li:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .headline-link {
      font-size: .85rem;
      color: #1e293b;
      text-decoration: none;
      line-height: 1.45;
      display: block;
    }
    .headline-link:hover { color: #2563eb; }
    .headline-time {
      font-size: .68rem;
      color: #94a3b8;
      margin-top: 3px;
    }

    /* ── Quick Links ── */
    .links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: .85rem;
      font-family: inherit;
      color: #334155;
      text-decoration: none;
      transition: background .13s, border-color .13s, color .13s;
    }
    .link-btn:hover {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    .link-arrow {
      font-size: .72rem;
      opacity: .45;
    }
    .link-btn:hover .link-arrow { opacity: 1; }

    /* ── Bottom grid ── */
    .dash-grid-bottom {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ── Clock ── */
    .clock-time {
      font-size: 2.6rem;
      font-weight: 200;
      letter-spacing: -.02em;
      color: #0f172a;
      line-height: 1;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }
    .clock-ampm {
      font-size: 1.1rem;
      font-weight: 400;
      color: #94a3b8;
      margin-left: 3px;
    }
    .clock-sub {
      font-size: .75rem;
      color: #94a3b8;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Quick Notes ── */
    .notes-card {
      display: flex;
      flex-direction: column;
    }
    .notes-card .notes-textarea {
      flex: 1;
    }
    .notes-textarea {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: .85rem;
      color: #1e293b;
      resize: vertical;
      outline: none;
      line-height: 1.55;
      background: #f8fafc;
      transition: border-color .13s, box-shadow .13s;
    }
    .notes-textarea:focus {
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }
    .notes-textarea::placeholder { color: #cbd5e1; }

    /* ── Market Snapshot ── */
    .market-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .market-row:last-of-type { border-bottom: none; }
    .market-name {
      font-size: .82rem;
      font-weight: 600;
      color: #334155;
    }
    .market-right { text-align: right; }
    .market-price {
      font-size: .88rem;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }
    .market-change {
      font-size: .72rem;
      font-variant-numeric: tabular-nums;
    }
    .market-change.up   { color: #16a34a; }
    .market-change.down { color: #dc2626; }
    .market-status {
      font-size: .65rem;
      color: #94a3b8;
      margin-top: 10px;
      text-align: right;
    }
    .market-loading, .market-error {
      font-size: .83rem;
      color: #94a3b8;
      padding: 8px 0;
    }

    /* ── Responsive ── */
    @media (max-width: 800px) {
      .dash-grid { grid-template-columns: 1fr 1fr; }
      .dash-grid-bottom { grid-template-columns: 1fr 1fr; }
      .headlines-card { grid-column: 1 / -1; }
      .notes-card { grid-column: 1 / -1; }
    }
    @media (max-width: 520px) {
      body { padding: 16px 12px; }
      .dash-grid { grid-template-columns: 1fr; }
      .dash-grid-bottom { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="dashboard">

    <header class="dash-header">
      <div class="dash-title">Work Dashboard</div>
    </header>

    <!-- Weather · Calendar · Clock -->
    <div class="dash-grid">

      <!-- Weather -->
      <div class="card">
        <div class="card-label">New York City</div>
        <div id="weather-content">
          <div class="weather-loading">Loading weather…</div>
        </div>
      </div>

      <!-- Calendar -->
      <div class="card">
        <div class="card-label">Calendar</div>
        <div class="cal-month" id="cal-month"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <!-- Clock -->
      <div class="card">
        <div class="card-label">New York Time</div>
        <div class="clock-time">
          <span id="clock-hm"></span><span class="clock-ampm" id="clock-ampm"></span>
        </div>
        <div class="clock-sub" id="clock-sub"></div>
      </div>

    </div>

    <!-- Quick Notes · WSJ Headlines · Market -->
    <div class="dash-grid-bottom">

      <!-- Quick Notes -->
      <div class="card notes-card">
        <div class="card-label">Quick Notes</div>
        <textarea class="notes-textarea" id="quick-notes" placeholder="Jot something down…"></textarea>
      </div>

      <!-- WSJ Headlines -->
      <div class="card headlines-card">
        <div class="card-label">Wall Street Journal</div>
        <div id="headlines-content">
          <div class="headlines-loading">Loading headlines…</div>
        </div>
      </div>

      <!-- Market Snapshot -->
      <div class="card">
        <div class="card-label">Markets</div>
        <div id="market-content">
          <div class="market-loading">Loading…</div>
        </div>
      </div>

    </div>

    <!-- Quick Links -->
    <div class="card">
      <div class="card-label">Quick Links</div>
      <div class="links-grid">
        <a class="link-btn" href="https://lastpass.com/login/" target="_blank" rel="noopener">
          LastPass <span class="link-arrow">↗</span>
        </a>
        <a class="link-btn" href="https://vault.netvoyage.com/neWeb2/home" target="_blank" rel="noopener">
          NetVoyage <span class="link-arrow">↗</span>
        </a>
        <a class="link-btn" href="https://web.auth.surepoint.cloud/" target="_blank" rel="noopener">
          SurePoint <span class="link-arrow">↗</span>
        </a>
        <a class="link-btn" href="https://1.next.westlaw.com/Search/Home.html?transitionType=Default&contextData=(sc.Default)&bhcp=1" target="_blank" rel="noopener">
          Westlaw <span class="link-arrow">↗</span>
        </a>
        <a class="link-btn" href="https://philipmtaylor.com/date-calculator.html" target="_blank" rel="noopener">
          Date Calculator <span class="link-arrow">↗</span>
        </a>
        <a class="link-btn" href="https://iapps.courts.state.ny.us/nyscef/HomePage" target="_blank" rel="noopener">
          NYSCEF <span class="link-arrow">↗</span>
        </a>
        <a class="link-btn" href="http://www.judiciary.state.nj.us/" target="_blank" rel="noopener">
          NJ Courts <span class="link-arrow">↗</span>
        </a>
        <a class="link-btn" href="https://pacer.uscourts.gov/file-case/court-cmecf-lookup" target="_blank" rel="noopener">
          PACER <span class="link-arrow">↗</span>
        </a>
      </div>
    </div>

  </div>
  <script>

    // ── Calendar ──────────────────────────────────────────

    (function () {
      const now   = new Date();
      const year  = now.getFullYear();
      const month = now.getMonth();
      const today = now.getDate();
      const MONTHS = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];

      document.getElementById('cal-month').textContent = `${MONTHS[month]} ${year}`;

      const grid = document.getElementById('cal-grid');
      ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(n => {
        const el = document.createElement('div');
        el.className = 'cal-day-name';
        el.textContent = n;
        grid.appendChild(el);
      });

      const firstDow    = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDow; i++) {
        const el = document.createElement('div');
        el.className = 'cal-day empty';
        grid.appendChild(el);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const el = document.createElement('div');
        el.className = 'cal-day' + (d === today ? ' today' : '');
        el.textContent = d;
        grid.appendChild(el);
      }
    })();

    // ── Weather (Open-Meteo, no key required) ─────────────

    const WMO = {
      0:  ['Clear',            '☀️'],
      1:  ['Mainly Clear',     '🌤️'],
      2:  ['Partly Cloudy',    '⛅'],
      3:  ['Overcast',         '☁️'],
      45: ['Foggy',            '🌫️'],
      48: ['Freezing Fog',     '🌫️'],
      51: ['Light Drizzle',    '🌦️'],
      53: ['Drizzle',          '🌦️'],
      55: ['Heavy Drizzle',    '🌦️'],
      61: ['Light Rain',       '🌧️'],
      63: ['Rain',             '🌧️'],
      65: ['Heavy Rain',       '🌧️'],
      71: ['Light Snow',       '🌨️'],
      73: ['Snow',             '🌨️'],
      75: ['Heavy Snow',       '❄️'],
      77: ['Snow Grains',      '❄️'],
      80: ['Rain Showers',     '🌦️'],
      81: ['Rain Showers',     '🌧️'],
      82: ['Heavy Showers',    '🌧️'],
      85: ['Snow Showers',     '🌨️'],
      86: ['Heavy Snow',       '❄️'],
      95: ['Thunderstorm',     '⛈️'],
      96: ['Thunderstorm',     '⛈️'],
      99: ['Thunderstorm',     '⛈️'],
    };

    async function loadWeather() {
      const url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=40.7128&longitude=-74.0060'
        + '&current=temperature_2m,apparent_temperature,weather_code'
        + '&daily=temperature_2m_max,temperature_2m_min'
        + '&temperature_unit=fahrenheit'
        + '&timezone=America%2FNew_York'
        + '&forecast_days=1';
      try {
        const data = await fetch(url).then(r => r.json());
        const cur  = data.current;
        const day  = data.daily;
        const [condition, emoji] = WMO[cur.weather_code] || ['—', '🌡️'];
        const el = document.getElementById('weather-content');
        el.innerHTML = '';

        const temp = document.createElement('div');
        temp.className = 'weather-temp';
        temp.innerHTML = `<span class="weather-emoji">${emoji}</span>${Math.round(cur.temperature_2m)}°F`;
        el.appendChild(temp);

        const cond = document.createElement('div');
        cond.className = 'weather-condition';
        cond.textContent = condition;
        el.appendChild(cond);

        const detail = document.createElement('div');
        detail.className = 'weather-detail';
        detail.innerHTML =
          `Feels like ${Math.round(cur.apparent_temperature)}°F<br>` +
          `H: ${Math.round(day.temperature_2m_max[0])}°&nbsp;&nbsp;·&nbsp;&nbsp;` +
          `L: ${Math.round(day.temperature_2m_min[0])}°`;
        el.appendChild(detail);
      } catch {
        document.getElementById('weather-content').innerHTML =
          '<div class="weather-error">Unable to load weather.</div>';
      }
    }

    // ── WSJ Headlines (read from daily-updated local JSON) ─

    async function loadHeadlines() {
      try {
        const data = await fetch('/data/wsj-headlines.json').then(r => r.json());
        if (!data.items?.length) throw new Error('empty');

        const container = document.getElementById('headlines-content');
        container.innerHTML = '';

        const list = document.createElement('ul');
        list.className = 'headlines-list';

        data.items.forEach(item => {
          const li = document.createElement('li');
          const a  = document.createElement('a');
          a.className   = 'headline-link';
          a.href        = item.link || '#';
          a.target      = '_blank';
          a.rel         = 'noopener';
          a.textContent = item.title;

          const time = document.createElement('div');
          time.className = 'headline-time';
          if (item.pubDate) {
            const pub = new Date(item.pubDate);
            time.textContent = pub.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
              + ' · ' + pub.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          }

          li.appendChild(a);
          li.appendChild(time);
          list.appendChild(li);
        });

        container.appendChild(list);

        if (data.updated) {
          const updated = document.createElement('div');
          updated.className = 'headline-time';
          updated.style.cssText = 'margin-top:10px;text-align:right;';
          const d = new Date(data.updated);
          updated.textContent = 'As of ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
            + ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          container.appendChild(updated);
        }
      } catch {
        document.getElementById('headlines-content').innerHTML =
          '<div class="headlines-error">Headlines not yet available — check back after 7 AM.</div>';
      }
    }

    // ── Live Clock ────────────────────────────────────────

    (function () {
      function updateClock() {
        const now = new Date();
        const full = now.toLocaleTimeString('en-US', {
          hour: 'numeric', minute: '2-digit', second: '2-digit',
          hour12: true, timeZone: 'America/New_York'
        });
        const m = full.match(/^(\d+:\d+):(\d+)\s*(AM|PM)$/i);
        if (m) {
          document.getElementById('clock-hm').textContent  = m[1];
          document.getElementById('clock-ampm').textContent = ' ' + m[3];
          document.getElementById('clock-sub').textContent  = ':' + m[2] + ' ET';
        }
      }
      updateClock();
      setInterval(updateClock, 1000);
    })();

    // ── Quick Notes ───────────────────────────────────────

    (function () {
      const ta = document.getElementById('quick-notes');
      ta.value = localStorage.getItem('dashboard-notes') || '';
      ta.addEventListener('input', () => localStorage.setItem('dashboard-notes', ta.value));
    })();

    // ── Market Snapshot (read from daily-updated local JSON) ─

    async function loadMarket() {
      try {
        const data = await fetch('/data/market.json').then(r => r.json());
        if (!data.items?.length) throw new Error('empty');

        const container = document.getElementById('market-content');
        container.innerHTML = '';

        data.items.forEach(q => {
          const isUp = q.change >= 0;

          const row = document.createElement('div');
          row.className = 'market-row';

          const name = document.createElement('div');
          name.className   = 'market-name';
          name.textContent = q.label;

          const right = document.createElement('div');
          right.className = 'market-right';

          const price = document.createElement('div');
          price.className   = 'market-price';
          price.textContent = q.price.toLocaleString('en-US',
            { minimumFractionDigits: 2, maximumFractionDigits: 2 });

          const change = document.createElement('div');
          change.className   = 'market-change ' + (isUp ? 'up' : 'down');
          change.textContent = (isUp ? '+' : '') + q.change.toFixed(2)
            + '  (' + (isUp ? '+' : '') + q.changePct.toFixed(2) + '%)';

          right.appendChild(price);
          right.appendChild(change);
          row.appendChild(name);
          row.appendChild(right);
          container.appendChild(row);
        });

        const status = document.createElement('div');
        status.className = 'market-status';
        const isOpen = data.items[0].state === 'REGULAR';
        if (data.updated) {
          const d = new Date(data.updated);
          status.textContent = (isOpen ? 'Market open · ' : 'As of ')
            + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }
        container.appendChild(status);

      } catch {
        document.getElementById('market-content').innerHTML =
          '<div class="market-error">Market data unavailable.</div>';
      }
    }

    loadWeather();
    loadHeadlines();
    loadMarket();
  </script>
</body>
</html>
