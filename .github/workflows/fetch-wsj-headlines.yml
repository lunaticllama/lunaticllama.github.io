name: Fetch WSJ Headlines

on:
  schedule:
    - cron: '0 12 * * *'   # 7 AM ET (approx) every day
  workflow_dispatch:         # Allow manual trigger from GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Test WSJ RSS reachability
        run: curl -sI -A "Mozilla/5.0" "https://feeds.wsj.com/wsj/xml/rss/3_7085.xml" | head -5

      - name: Fetch WSJ headlines
        run: python3 .github/scripts/fetch-headlines.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wsj-headlines.json
          git diff --staged --quiet || git commit -m "Update WSJ headlines [skip ci]"
          git pull --rebase
          git push
