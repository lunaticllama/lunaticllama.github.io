name: Check CPLR Snapshot

on:
  schedule:
    - cron: '0 13 * * 1'    # Mondays, 9 AM ET
  workflow_dispatch:         # Allow manual trigger from GitHub Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Compare snapshot with Open Legislation API
        id: check
        env:
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: |
          set +e
          python3 .github/scripts/check-cplr.py
          code=$?
          if [ $code -eq 2 ]; then exit 1; fi
          echo "changed=$([ $code -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open or update issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="CPLR snapshot is out of date"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file cplr-report.md
          else
            gh issue create --title "$title" --body-file cplr-report.md
          fi
